# ─────────────────────────────────────────────────────────────────────────────
#  Figma Desktop Bridge para o DeepSeek Harness (Maya)
#
#  Este bloco é um "patch entry" do Cordis. Ele é anexado ao final de:
#      C:\Users\padill\.dsh\profiles\desktop\cordis.patch.yml
#
#  Depois de anexar, feche e reabra o DeepSeek Harness.
#  As ferramentas do servidor passam a aparecer para a agente como:
#      mcp__figma__<nome_da_tool>
#
#  Pré-requisito: plugin "Figma Desktop Bridge" rodando dentro do Figma
#  (Plugins → Development → Figma Desktop Bridge).
# ─────────────────────────────────────────────────────────────────────────────

- insert:
    - id: mcp-figma-bridge
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: figma
        transport: stdio
        command: 'C:\Program Files\nodejs\npx.cmd'
        args:
          - '-y'
          - 'figma-console-mcp'
        env:
          FIGMA_ACCESS_TOKEN: 'YOUR_FIGMA_ACCESS_TOKEN'
        toolCallTimeoutMs: 120000
        failOnStartupError: false

# ─────────────────────────────────────────────────────────────────────────────
#  OPCIONAL — servidor REST antigo (http://127.0.0.1:3333/mcp)
#  Só descomente se você realmente subir esse servidor; senão o DSH vai ficar
#  tentando reconectar num endpoint morto. Troque o token abaixo.
#
# - insert:
#     - id: mcp-figma-rest
#       name: '@deepseek-ai/dsh-mcp-client'
#       config:
#         serverName: figma_rest
#         transport: streamable-http
#         url: http://127.0.0.1:3333/mcp
#         headers:
#           X-Figma-Token: 'YOUR_FIGMA_ACCESS_TOKEN'
#         failOnStartupError: false
# ─────────────────────────────────────────────────────────────────────────────
